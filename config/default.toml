# Default Headway configuration.
# Override any value with an environment variable: HEADWAY_<SECTION>__<KEY>,
# for example HEADWAY_COLLECT__INTERVAL_S=30.
# The Golemio API token is never configured here; it is read only from GOLEMIO_TOKEN.

[paths]
data_dir = "data"
raw_dir = "raw"
manifest_dir = "raw/manifest"
gtfs_dir = "gtfs"

[collect]
# Primary source, see docs/api.md. limit defaults to 100 upstream; 10000 is the documented max.
url = "https://api.golemio.cz/v2/vehiclepositions"
params = { limit = "10000" }
interval_s = 20
timeout_s = 10.0
# Retries within one tick; never beyond the start of the next tick.
max_attempts = 3
backoff_initial_s = 1.0
backoff_max_s = 8.0
# Manifest rows are buffered in memory and written at least this often.
manifest_flush_s = 300
# Health thresholds.
stale_after_identical = 3
error_streak_alert = 5
gap_factor = 2.0
heartbeat_interval_s = 3600
# Optional ntfy topic URL for heartbeats and alerts; empty disables it.
# Set it via HEADWAY_COLLECT__NTFY_URL in the deployment env file, not here.
ntfy_url = ""

[gtfs]
# Static PID timetable published by ROPID (CC BY 4.0).
url = "https://data.pid.cz/PID_GTFS.zip"
timeout_s = 300.0

[ingest]
# A service day starts at 04:30 local time, after the last night trips (about 04:20).
# Trips that start earlier belong to the previous service day. This boundary is a Headway
# convention chosen for the ingest, not a PID rule.
service_day_start_min = 270
# A service day reads polls fetched from 2 h before it until 9 h after it, so trips that
# start early or run late are complete. Positions observed outside the window are not read.
window_before_h = 2.0
window_after_h = 9.0
# Unknown-field detection is costly, so it runs on every Nth poll only.
schema_check_every = 60
parser_version = "v1"

[time]
local_tz = "Europe/Prague"
